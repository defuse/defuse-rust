services:
  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
      # Run on first startup (when the data volume is empty), in alphabetical order
      - ./01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./02-timecapsule-seed.sql:/docker-entrypoint-initdb.d/02-timecapsule-seed.sql:ro
      - ./03-upvotes-seed.sql:/docker-entrypoint-initdb.d/03-upvotes-seed.sql:ro
    command: >
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M

volumes:
  mysql-data:

[package]
name = "defuse"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["fs"] }

# Templating
askama = "0.12"
askama_axum = "0.4"

# Hashing (for checksums page example)
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Form parsing
serde = { version = "1", features = ["derive"] }

# Config
dotenvy = "0.15"

[package]
name = "defuse"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "catch-panic"] }

# Templating
askama = "0.12"
askama_axum = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }

# Hashing (for checksums page)
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
md2 = "0.10"
md4 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
gost94 = "0.10"
hex = "0.4"

# Checksums
adler2 = "2.0"
crc = "3.2"

# For LM hash (DES-based)
des = "0.8"

# For pastebin AES-256-CBC encryption
aes = "0.8"
cbc = "0.1"
hmac = "0.12"

# Form parsing
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
multer = "3"
futures-util = "0.3"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vim syntax highlighting
tempfile = "3"
fs2 = "0.4"
bytes = "1.11.0"
serde_urlencoded = "0.7.1"

# Parser for big number calculator
pest = "2"
pest_derive = "2"

# Regex for html escape
regex = "1"

# Cryptographically secure random for passgen
rand = "0.8"

# HTTP client for reCAPTCHA verification
reqwest = { version = "0.12", features = ["json"] }

# Date/time formatting
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Signal handling (reset SIGINT to default for force-quit)
libc = "0.2"

# Special endpoints (ip, shout)
dns-lookup = "2"
base64 = "0.22"
urlencoding = "2"
subtle = "2.6.1"

# Markdown rendering (GitHub Flavored Markdown)
comrak = "0.36"

[build-dependencies]
glob = "0.3"

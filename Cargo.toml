[package]
name = "defuse"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "catch-panic"] }

# Templating
askama = "0.12"
askama_axum = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }

# Hashing (for checksums page)
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
md2 = "0.10"
md4 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
gost94 = "0.10"
hex = "0.4"

# Checksums
adler = "1.0"
crc = "3.2"

# For LM hash (DES-based)
des = "0.8"

# Form parsing
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
multer = "3"
futures-util = "0.3"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vim syntax highlighting
tempfile = "3"
bytes = "1.11.0"
serde_urlencoded = "0.7.1"

# Parser for big number calculator
pest = "2"
pest_derive = "2"

# Regex for html escape
regex = "1"

# Cryptographically secure random for passgen
rand = "0.8"
